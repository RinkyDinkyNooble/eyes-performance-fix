modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_issues}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="${mod_url}"
logoFile="${mod_id}.png"
logoBlur=false
authors="${mod_authors}"
credits="The eYes Are Back is made by Caliy the Calico and FabexSrednica. This is an unofficial patch for it."
# Works on either side alone, so a client and server don't have to match.
displayTest="IGNORE_ALL_VERSION"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="the_eyes_are_back"
    mandatory=true
    versionRange="${eyes_version_range}"
    ordering="AFTER"
    side="BOTH"
